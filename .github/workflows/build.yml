name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DeepScan.csproj --configuration Release
      - name: Publish
        run: dotnet publish DeepScan.csproj --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/deepscan-publish"
      - name: Verify published pages and endpoints
        shell: bash
        run: |
          publish_dir="$RUNNER_TEMP/deepscan-publish"
          test -s "$publish_dir/index.html"
          test -s "$publish_dir/cyber-safety-toolkit/index.html"
          test -s "$publish_dir/network-scanner/index.html"

          base_url="http://127.0.0.1:5087"
          dotnet "$publish_dir/DeepScan.dll" --urls "$base_url" > "$RUNNER_TEMP/deepscan.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$base_url/api/health" > "$RUNNER_TEMP/health.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/deepscan.log"
            exit 1
          fi
          grep -q 'not-configured' "$RUNNER_TEMP/health.json"
          curl --fail --silent "$base_url/" --output "$RUNNER_TEMP/home.html"
          curl --fail --silent "$base_url/cyber-safety-toolkit" --output "$RUNNER_TEMP/cyber-safety-toolkit.html"
          curl --fail --silent "$base_url/network-scanner" --output "$RUNNER_TEMP/network-scanner.html"
          grep -q 'DeepScan' "$RUNNER_TEMP/home.html"
          grep -q 'Cyber Safety Toolkit' "$RUNNER_TEMP/cyber-safety-toolkit.html"
          grep -q 'Authorized Network Exposure Scanner' "$RUNNER_TEMP/network-scanner.html"
          curl --fail --silent "$base_url/api/network-scanner/status" | grep -q '"configured":false'
